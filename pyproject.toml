[project]
name = "po-core"
version = "0.3.3"
description = "Dev tooling for the po_core dbt package (not needed by clients installing the package)"
requires-python = ">=3.12"
dependencies = [
    # Same dbt minor version as po-nonprofit-analytics (the first project the engine plugs into).
    "dbt-core>=1.11,<1.12",
    # DuckDB adapter: integration_tests/ run against a local file, no cloud credentials needed.
    "dbt-duckdb",
]
