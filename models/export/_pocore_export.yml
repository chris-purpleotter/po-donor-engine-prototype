version: 2

# EXPORT (v0.3.1): tables shaped for one consumer, Supporter Insights (pocore-pack). Built from
# foundation in the same run as everything else, so the pack can never be out of step with the
# certified tables. Module 'pack' (on by default). Schema: pocore, next to certified.

models:
  - name: pocore_export__pack_cube
    description: >
      One row per period (now / recent / same_season) x combination of the client's pack
      dimension values: people, gave (within pack.window_days), revenue of givers and non-givers.
      Counts and sums only. Population: individuals, not deceased. The 'now' rows add up to
      everyone in the population at the latest month-end (tested).
    columns:
      - name: period
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['now', 'recent', 'same_season']
      - name: people
        data_tests: [not_null]

  - name: pocore_export__pack_settings
    description: "One row per Supporter Insights setting (client_name, window_days, holdout_pct, min_group_size, engine_version, as_of)."
    data_tests:
      - pocore_unique_combination:
          arguments: {columns: ['setting']}

  - name: pocore_export__pack_dimensions
    description: >
      The pack's "Build a population" dropdowns in order: one row per plain dimension, or per band
      of a banded one. band_sql is the SQL the pack writes into the segment rules it generates.
    data_tests:
      - pocore_unique_combination:
          arguments: {columns: ['dimension', 'band_position']}

  - name: pocore_export__pack_measures
    description: >
      One row per group measure (primary_kpi), from macro pocore_measures: measure_name ("gave"),
      phrase with a {days} placeholder ("gave within {days} days") and adds_up (a longer window
      always includes a shorter one; false for retained). The pack words its charts from this.
    data_tests:
      - pocore_unique_combination:
          arguments: {columns: ['kpi_id']}
