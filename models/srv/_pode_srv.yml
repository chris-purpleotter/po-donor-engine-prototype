version: 2

# SERVING layer (SPEC D13): the only schema clients expose to BI tools and LLMs.
# Rule: every row is a final answer at the stated grain; the table's obvious grouping
# is correct. All logic lives in SQL. Tool-neutral: no BI-tool metadata here. Clients add
# their tool's semantic layer on their own models on top (dbt won't let a project add
# YAML to a package's models), e.g. thin `select *` views with Lightdash meta.

models:
  - name: pode_srv__segment_summary
    description: >
      One row per segment, as of today. Donors in the segment now; how they normally do on the
      segment's primary KPI over its primary window (rate_recent = today's normal, rate_typical =
      pooled over the last 12 months); whether a test is worth running (detectable_lift,
      is_testable, readable_by at the default holdout); and what improvement is worth
      (value_per_point: each +1 point on the KPI; value_of_detectable_lift: the smallest provable lift).
      Segments can overlap (custom ones especially): don't add donors_at_snapshot across segments.
    data_tests:
      - pode_unique_combination:
          arguments: {columns: ['segment_id']}
    columns:
      - name: donors_at_snapshot
        description: "Donors in the segment at the latest month-end."
      - name: outcome_window_days
        description: "The segment's primary window (new 90, lapsed 180, others 365)."
      - name: primary_kpi
        description: "What success means for this segment: 'gave' (a qualifying gift within the window) or 'retained' (still an active sustainer at the end of it; used for sustainers)."
      - name: rate_recent
        description: "Share of the segment achieving the primary KPI within the window, over the most recent complete months: today's normal."
      - name: rate_typical
        description: "The same, pooled over the last 12 complete months."
      - name: rate_same_season
        description: "The same, for the same months last year (snapshots 11-13 months ago). A test launched now runs through the same season, so this is the planning baseline. Null with too little history."
      - name: planning_basis
        description: "Which rate the detectable lift uses: 'same_season', or 'recent' when there isn't a year of history."
      - name: is_unstable
        description: "Recent and 12-month rates differ a lot, or the months swing widely."
      - name: detectable_lift
        description: "Smallest lift (as a fraction) a test with holdout_pct held out could reliably detect, vs the planning baseline (planning_basis)."
      - name: is_testable
        description: "Whether a test here could realistically give a clear answer (detectable lift <= +50% relative)."
      - name: revenue_per_extra_donor
        description: "What one extra success has been worth: capped window revenue among donors who achieved the KPI minus among those who didn't. Observational."
      - name: value_per_point
        description: "What each +1 percentage point on the KPI is worth over the window: donors x 0.01 x revenue_per_extra_donor. The headline for 'where is the money'. Rough sizing, not a forecast."
      - name: extra_donors_at_detectable_lift
        description: "Extra donors achieving the KPI if the rate rose by exactly the detectable lift."
      - name: value_of_detectable_lift
        description: "Value of the smallest provable lift (extra_donors_at_detectable_lift x revenue_per_extra_donor). A floor for test planning; shrinks with bigger holdouts, so don't rank segments by it."

  - name: pode_srv__segment_summary_by_slice
    description: >
      One row per segment x slice, as of today: the same columns as pode_srv__segment_summary,
      split by a donor attribute (slice_by: acquisition_channel, region, first_gift_band, attr_*).
      Pick ONE slice_by at a time: within it the slices add up to the segment; across slice_by
      values they overlap.
    data_tests:
      - pode_unique_combination:
          arguments: {columns: ['segment_id', 'slice_by', 'slice']}

  - name: pode_srv__segment_trend
    description: >
      One row per segment per month-end (whole segments). donors_in_segment is the count at that
      month-end (don't add it across months). gave_rate_<N>d / retained_rate_<N>d /
      revenue_per_donor_<N>d describe what those donors did in the N days after; drop rows where
      is_complete_<N>d is false. To pool over several months use the counts:
      sum(gave_count_<N>d) / sum(donors_in_segment), never an average of the rates.
    data_tests:
      - pode_unique_combination:
          arguments: {columns: ['segment_id', 'snapshot_date']}
    columns:
      - name: donors_in_segment
        description: "Donors in the segment at that month-end (point in time: don't add across months)."
      - name: donors_entering
        description: "Donors in the segment at this month-end who weren't at the previous one (a monthly flow: fine to add across months). Null for the first month."
      - name: donors_leaving
        description: "Donors in the segment at the previous month-end who aren't at this one (monthly flow). Null for the first month."

  - name: pode_srv__test_planning
    description: >
      One row per segment x window x holdout option (whole segments), on each segment's primary
      KPI. Compare options: a bigger holdout detects smaller lifts but withholds the treatment
      from more donors. Nothing here should be added up.
    data_tests:
      - pode_unique_combination:
          arguments: {columns: ['segment_id', 'outcome_window_days', 'holdout_pct']}

  - name: pode_srv__donor_movement
    description: >
      One row per (fiscal) year: the donor file's movement funnel. total_donors = new +
      second_year + continuing + reactivated + reactivated_second_year, and it balances:
      this year's total = last year's total - lost + new + reactivated. Retention rates are
      vs last year. is_partial_year = current year to date. has_full_history = false for the
      first 5 years of data, when New/Reactivated over-count.
    data_tests:
      - pode_unique_combination:
          arguments: {columns: ['giving_year']}
    columns:
      - name: giving_year
        description: "Fiscal year, named by the calendar year it ends in (calendar year when fiscal_year_start_month = 1)."
      - name: lost_donors
        description: "Gave last year, not this year."
      - name: new_donor_retention
        description: "Second-year donors / last year's new donors."
      - name: overall_retention
        description: "(Second year + continuing + reactivated second year) / last year's total donors."

  - name: pode_srv__donor_cohorts
    description: >
      One row per acquisition cohort x year. cohort_year = year of the donors' first-ever gift.
      Follows each cohort through later years: total_donors (cohort members who gave that year,
      by annual status) and pct_of_cohort (the retention curve). Don't add total_donors across
      years: the same donor gives in several.
    data_tests:
      - pode_unique_combination:
          arguments: {columns: ['cohort_year', 'giving_year']}
    columns:
      - name: cohort_year
        description: "Year of the cohort's first-ever gift (fiscal when fiscal_year_start_month > 1)."
      - name: years_since_acquisition
        description: "0 = the acquisition year."
      - name: pct_of_cohort
        description: "Share of the cohort that gave this year."

  - name: pode_srv__sustainer_ltv
    description: >
      One row per sustainer start cohort x slice (start_cohort = fiscal year of the first recurring
      payment, or 'all'; slice_by = 'all' or 'acquisition_channel'). Sustainers started, survival
      (share still giving in month N, among those who have reached it), and LTV (average recurring
      revenue per starter through month N; null until someone has reached month N). When the client
      supplies acquisition_cost: paid sustainers, cost per new sustainer (CPA, paid only) and LTV:CPA.
      Pick ONE start_cohort and ONE slice_by at a time; rows overlap across them.
    data_tests:
      - pode_unique_combination:
          arguments: {columns: ['start_cohort', 'slice_by', 'slice']}
    columns:
      - name: start_cohort
        description: "Fiscal year of the first recurring payment, or 'all' (mixes cohorts: later months come only from older ones)."
      - name: cost_per_new_sustainer
        description: "Total acquisition cost / paid sustainers (starters with cost > 0). Null without cost data."

  - name: pode_srv__reconciliation
    description: >
      The sign-off numbers. One row per month x gift_category x donor_type x eligibility /
      exclusion_reason x gift_type x refund flag. Every canonical gift is counted exactly once,
      including gifts after as_of (is_after_as_of). gifts and net_amount add up across any
      grouping: total by giving_year to compare with finance; by exclusion_reason to explain
      the gap; recurring share by month = recurring non-refund gifts / all non-refund gifts.
    data_tests:
      - pode_unique_combination:
          arguments: {columns: ['gift_month', 'gift_category', 'donor_type', 'is_kpi_eligible', 'exclusion_reason', 'gift_type', 'is_refund', 'is_after_as_of']}
    columns:
      - name: giving_year
        description: "Fiscal year of the gift (calendar year when fiscal_year_start_month = 1)."
      - name: exclusion_reason
        description: "Why the gift isn't KPI-eligible; null for eligible gifts."
      - name: net_amount
        description: "Sum of amounts (refunds are negative)."

  - name: pode_srv__project_health
    description: >
      One row per check (finance_match: one per year): sign-off and data-health checks that pass
      the dbt tests but need a human look. status ok / warn / info; value vs threshold. Every row
      carries the run context (as_of, fiscal_year_start_month, modules_on).
    data_tests:
      - pode_unique_combination:
          arguments: {columns: ['check_id', 'scope']}
    columns:
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['ok', 'warn', 'info']

  - name: pode_srv__segment_roster
    description: >
      One row per segment x donor, as of the latest month-end: who is in each segment right now,
      with the attributes needed to act on the list. Counting rows for one segment = its donors.
      A donor can appear in several segments.
    data_tests:
      - pode_unique_combination:
          arguments: {columns: ['segment_id', 'donor_id']}
