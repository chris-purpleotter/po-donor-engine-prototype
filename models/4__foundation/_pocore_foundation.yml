version: 2

# FOUNDATION: the STAR. Two dimensions (person, date) and two facts:
#   foundation__gift                "what happened": one row per gift; sum freely over people AND time
#   foundation__person__month_end   "where they stood": a moment; sum across people at ONE month-end only
# No business opinions, no copied attributes: join the dimensions (person_id; a date to date_day).
# Grain = the table name; keys are tested unique; every foreign key is tested.

models:
  - name: pocore_foundation__person
    description: >
      DIMENSION. One row per person: everyone in the `people` contract, with or without gifts.
      Who they are now (contract attributes and the client's attr_* columns, current values) and
      where the record came from (source_system, source_record_id). No state or measures.
    data_tests:
      - pocore_unique_combination:
          arguments: {columns: ['person_id']}
    columns:
      - name: person_id
        data_tests: [not_null]
      - name: source_system
        description: "Lineage: the system this person record came from."
      - name: source_record_id
        description: "Lineage: the record's id in source_system."

  - name: pocore_foundation__gift
    description: >
      TRANSACTION FACT. One row per gift: every gift and refund in the `gifts` contract, eligible
      or not, so totals tie exactly to the input. Contract columns, attr_* gift columns, lineage,
      and the engine's gift-level definitions: is_qualifying (counts as "gave"),
      is_recurring_payment, gift_number / is_first_gift, is_reactivation_gift,
      days_since_previous_gift, and stage_at_gift. Amounts add up freely over any period.
    data_tests:
      - pocore_unique_combination:
          arguments: {columns: ['gift_id']}
    columns:
      - name: gift_id
        data_tests: [not_null]
      - name: person_id
        data_tests:
          - relationships:
              arguments: {to: ref('pocore_foundation__person'), field: person_id}
      - name: is_qualifying
        description: "Counts as 'gave' (KPI gave): eligible, not a refund, and one-time or the first payment of a recurring schedule (a new sign-up). Routine recurring payments are false."
      - name: is_first_recurring_payment
        description: "The first eligible payment we can see in a recurring schedule: a new monthly sign-up (measure started_monthly)."
      - name: is_recurring_payment
        description: "Eligible, non-refund recurring payment (the basis of sustainer status and the retained KPI)."
      - name: gift_number
        description: "1, 2, 3 ... among the person's eligible, non-refund gifts. Null for refunds and ineligible gifts."
      - name: is_first_gift
        description: "The person's first eligible, non-refund gift: counting these by period = new donors acquired."
      - name: is_reactivation_gift
        description: "Eligible, non-refund gift more than 365 days after the person's previous one."
      - name: stage_at_gift
        description: "The person's lifecycle stage at the last month-end before the gift. Null for gifts before the snapshot history starts."

  - name: pocore_foundation__person__month_end
    description: >
      SNAPSHOT FACT (a moment). One row per person x month-end (the last snapshot_lookback_months
      month-ends, from when the person existed). Looking BACK: state as of that date from earlier
      gifts only (derived values next to ingredients, plus rollup_* columns). Looking AHEAD:
      outcomes in the 30/90/180/365 days after it (gave_<N>d, revenue_<N>d, retained_<N>d for 90+,
      is_complete_<N>d), and next_gave_date (first qualifying gift in the 365 days after, or null).
      Never sum across month-ends; sum across people at one month-end.
    data_tests:
      - pocore_unique_combination:
          arguments: {columns: ['person_id', 'month_end_date']}
    columns:
      - name: person_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('pocore_foundation__person'), field: person_id}
      - name: month_end_date
        data_tests: [not_null]
      - name: is_complete_90d
        description: "True when the 90 days after month_end_date have fully happened by as_of. Rows where this is false have partial outcomes: never treat them as final. (Same for each window.)"

  - name: pocore_foundation__date
    description: >
      DIMENSION. One row per day, from the earliest gift to as_of: month start/end, calendar year,
      quarter and month, fiscal_year, is_month_end, is_latest_month_end. Join a fact's date to
      date_day to group by any period, or pin the month-end snapshot to one moment.
    data_tests:
      - pocore_unique_combination:
          arguments: {columns: ['date_day']}
    columns:
      - name: date_day
        data_tests: [not_null]

