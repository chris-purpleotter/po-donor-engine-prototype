version: 2

# INPUT: the contract (the client's conform models, typed and tested). Views.

models:
  - name: pocore_input__people
    description: "Canonical donors: one row per donor at the client's chosen grain (D2). Includes prospects (zero gifts)."
    config:
      contract: {enforced: true}
    columns:
      - name: person_id
        data_type: string
        description: "Stable donor key. Grain (contact or household) is chosen in conform and fixed per client."
        data_tests: [unique, not_null]
      - name: created_at
        data_type: date
        description: "When the donor record came into existence. Prospects never appear in snapshots before this date."
        data_tests: [not_null]
      - name: region
        data_type: string
        description: "Current region. Current-value attribute, allowed under D7."
      - name: acquisition_channel
        data_type: string
        description: "How the donor was acquired. Current-value attribute, allowed under D7."
      - name: acquisition_theme
        data_type: string
        description: "Content theme at acquisition, if known."
      - name: person_type
        data_type: string
        description: "individual | organization. Standard segments default to individuals."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['individual', 'organization']
      - name: is_deceased
        data_type: boolean
        description: "Deceased donors are excluded from segments by default (never in a treatment list)."
        data_tests: [not_null]
      - name: source_system
        data_type: string
        description: "Lineage: the system this person record came from (e.g. 'salesforce', 'mailchimp'). Empty is allowed but warned."
        data_tests:
          - not_null:
              config: {severity: warn}
      - name: source_record_id
        data_type: string
        description: "Lineage: the record's id in source_system, so any row can be traced back to the source."
        data_tests:
          - not_null:
              config: {severity: warn}

  - name: pocore_input__person_attributes
    description: >
      Client-chosen extra donor columns (var people_extra_columns), from the same conform model
      as pocore_input__people, renamed attr_<name>. Not contracted. Flows into the donor snapshot for
      segment rules and breakdowns. Current values only: never attributes that change because
      of giving (D7).
    columns:
      - name: person_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('pocore_input__people')
                field: person_id

  - name: pocore_input__gift_attributes
    description: >
      Client-chosen extra gift columns (var gifts_extra_columns), from the same conform model as
      pocore_input__gifts, renamed attr_<name>. Not contracted. Gift-level only on day one.
    columns:
      - name: gift_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('pocore_input__gifts')
                field: gift_id

  - name: pocore_input__gifts
    description: "Canonical gifts: every hard-credit revenue row, labelled, never dropped (D1). Soft credits excluded."
    config:
      contract: {enforced: true}
    data_tests:
      - pocore_refund_sign
      - pocore_recurring_has_schedule
      - pocore_exclusion_reason_consistent
      - pocore_suspected_unlinked_recurring   # severity: warn (heuristic)
    columns:
      - name: gift_id
        data_type: string
        data_tests: [unique, not_null]
      - name: person_id
        data_type: string
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('pocore_input__people')
                field: person_id
      - name: gift_date
        data_type: date
        description: "Client-local date (D5)."
        data_tests: [not_null]
      - name: amount
        data_type: "{{ 'numeric' if target.type == 'bigquery' else 'numeric(18,2)' }}"   # must mirror macros/pocore_type_money.sql
        description: "Reporting currency. Refunds negative, everything else positive (D4)."
        data_tests: [not_null]
      - name: gift_type
        data_type: string
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['one_time', 'recurring']
      - name: recurring_schedule_id
        data_type: string
        description: "Required when gift_type = 'recurring' (see pocore_recurring_has_schedule)."
      - name: is_refund
        data_type: boolean
        data_tests: [not_null]
      - name: gift_category
        data_type: string
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['cash', 'pledge_payment', 'matching', 'daf', 'grant', 'bequest', 'in_kind', 'other']
      - name: is_kpi_eligible
        data_type: boolean
        description: "Conform's decision (default via pocore_default_kpi_eligible + client rules)."
        data_tests: [not_null]
      - name: exclusion_reason
        data_type: string
        description: "Null exactly when is_kpi_eligible is true (see pocore_exclusion_reason_consistent)."
      - name: source_system
        data_type: string
        description: "Lineage: the system this gift record came from (e.g. 'salesforce', 'mailchimp'). Empty is allowed but warned."
        data_tests:
          - not_null:
              config: {severity: warn}
      - name: source_record_id
        data_type: string
        description: "Lineage: the record's id in source_system, so any row can be traced back to the source."
        data_tests:
          - not_null:
              config: {severity: warn}

  - name: pocore_input__person_identities
    description: >
      The identity crosswalk (v0.4.0): one row per source record -> the person it belongs to.
      From the client's var person_identities_model when set (several source records per person,
      e.g. a CRM contact and an email-tool contact resolved to one person); otherwise built from
      the people contract's own source_system / source_record_id (one identity per person).
    data_tests:
      - pocore_unique_combination:
          arguments: {columns: ['source_system', 'source_record_id']}
    columns:
      - name: source_system
        data_tests: [not_null]
      - name: source_record_id
        data_tests: [not_null]
      - name: person_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('pocore_input__people')
                field: person_id
