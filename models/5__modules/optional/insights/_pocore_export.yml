version: 2

# EXPORT (v0.3.1): tables shaped for one consumer, Supporter Insights (pocore-insights). Built from
# foundation in the same run as everything else, so the report can never be out of step with the
# certified tables. Module 'insights' (on by default). Schema: pocore, next to certified.

models:
  - name: pocore_export__insights_cube
    description: >
      One row per period (now / recent / same_season) x combination of the client's insights
      dimension values: people, gave (within insights.window_days), revenue of givers and non-givers.
      Counts and sums only. Population: individuals, not deceased. The 'now' rows add up to
      everyone in the population at the latest month-end (tested).
    columns:
      - name: period
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['now', 'recent', 'same_season']
      - name: people
        data_tests: [not_null]

  - name: pocore_export__insights_settings
    description: "One row per Supporter Insights setting (client_name, window_days, holdout_pct, min_group_size, engine_version, as_of)."
    data_tests:
      - pocore_unique_combination:
          arguments: {columns: ['setting']}

  - name: pocore_export__insights_dimensions
    description: >
      The report's "Build a population" dropdowns in order: one row per plain dimension, or per band
      of a banded one. band_sql is the SQL the report writes into the group rules it generates.
    data_tests:
      - pocore_unique_combination:
          arguments: {columns: ['dimension', 'band_position']}

  - name: pocore_export__insights_measures
    description: >
      One row per group measure (primary_kpi), from macro pocore_engine_config__measures: measure_name ("gave"),
      phrase with a {days} placeholder ("gave within {days} days") and adds_up (a longer window
      always includes a shorter one; false for retained). The report words its charts from this.
    data_tests:
      - pocore_unique_combination:
          arguments: {columns: ['kpi_id']}

  - name: pocore_export__insights_month
    description: >
      One row per calendar month (the last 36 up to as_of): new donors, win-backs, monthly sign-ups,
      gifts, donors and net giving across the organisation (individuals, eligible gifts). Events, so
      months add up, except donors (distinct people within the month).
    data_tests:
      - pocore_unique_combination:
          arguments: {columns: ['month_start_date']}

  - name: pocore_export__insights_tenure
    description: >
      One row per group x month-end x tenure band: how long the people in the group at that
      month-end had been in it (current term, pocore__person__group__term), in the bands of
      module__group.tenure_bands_months, counted back from the row's month-end ("1-2 years before").
      months_from / months_to: the band in months before that month-end (inclusive; months_to null
      for the top band and "unknown"). A group's bands at one month-end add up to its people.
    data_tests:
      - pocore_unique_combination:
          arguments: {columns: ['group_id', 'month_end_date', 'band_order']}

  - name: pocore_export__insights_next_gift
    description: >
      One row per group x month-end x month after (1-12): how many of the group's people made their
      first qualifying gift after that month-end in that calendar month (next_gave_date). Each
      person once, so months 1-12 add up to "gave within 365 days".
    data_tests:
      - pocore_unique_combination:
          arguments: {columns: ['group_id', 'month_end_date', 'months_after']}

