# po_core — reusable giving analytics engine: conformed contract in, foundation + certified tables out.
# This is a dbt *package*: client projects install it via packages.yml.
# See SPEC.md and DESIGN_v0.2.0.md for the design and decisions.

name: 'po_core'
version: '0.7.2'
config-version: 2

# Refuse to run on untested dbt versions (widen deliberately after testing).
require-dbt-version: [">=1.11.0", "<1.12.0"]

# No `profile:` — a package has no warehouse connection of its own;
# it runs on whatever connection the installing client project uses.

model-paths: ["models"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]   # examples to copy (compiled, never built): e.g. the segment explorer
seed-paths: ["seeds"]
test-paths: ["tests"]

models:
  po_core:
    +schema: pocore_internal      # INTERNAL steps and modules: visible, unsupported, may change in any release
    +materialized: table
    +tags: ['pocore']             # select engine models with `tag:pocore` regardless of client folder layout
    # --- the foundation pipeline (always built):
    #     input -> entity (who exists)   ------------------------> foundation star
    #     input -> event (what happened) -> rollup (per person) -> foundation star
    1__input:
      +materialized: view         # the contract: checks over the client's conform models; no need to copy data
      +tags: ['pocore_input']
    2__entity:
      +tags: ['pocore_entity']    # one row per thing that exists (a person), with engine-standard attributes
    2__event:
      +tags: ['pocore_event']     # one row per thing that happened (a gift), with the engine's definitions
    3__rollup:
      +tags: ['pocore_rollup']    # one person per period, from fact models only
    4__foundation:
      +schema: pocore_foundation  # FOUNDATION: tested facts + definitions for advanced analysts (DESIGN §6.1)
      +tags: ['pocore_foundation']
    # --- modules: use cases built on top of the foundation
    5__modules:
      required:                       # always built: insights and admin depend on it (no switch)
        group:
          +tags: ['pocore_group']       # segments: who was in a situation at each month-end, and how they did
          certified:
            +schema: pocore             # CERTIFIED: this module's public outputs, where BI tools connect
            +tags: ['pocore_certified']
      optional:                       # each has `enabled` in its module__<name> block
        movement:
          +tags: ['pocore_movement']    # yearly donor status
          certified:
            +schema: pocore             # CERTIFIED: this module's public outputs, where BI tools connect
            +tags: ['pocore_certified']
        cohort:
          +tags: ['pocore_cohort']      # people who started together, and how they aged
          certified:
            +schema: pocore             # CERTIFIED: this module's public outputs, where BI tools connect
            +tags: ['pocore_certified']
        insights:
          +schema: pocore               # EXPORT: tables shaped for Supporter Insights (module 'insights')
          +tags: ['pocore_export']
    9__admin:
      +schema: pocore             # ADMIN: sign-off and health tables, next to certified
      +tags: ['pocore_admin']
vars:
  po_core:
    # Every setting a client can change, grouped by WHAT IT CHANGES. Clients override any of these
    # under `vars: po_core:` in their own dbt_project.yml.

    # ── FOUNDATION: changes the star (every downstream table, BI tool and analyst sees it) ─────────
    # Inputs: engine slot -> the client's conform model NAME (not a path)
    people_model: people
    gifts_model: gifts
    # Extra columns brought through from the conform models, as attr_<name>
    people_extra_columns: []          # person attributes: usable in segment rules, split_by and report dropdowns
    gifts_extra_columns: []
    # Time
    # `as_of` deliberately has NO default: it must come from the client (env var PO_AS_OF). See D3.
    fiscal_year_start_month: 1        # 1 = calendar year; 4 = April, 7 = July ... (FY named by its end year)
    snapshot_lookback_months: 72      # month-end rows kept (earlier history still counts in lifetime values)
    # Definitions
    recurring_active_days: 45         # a recurring payment this recent = an active sustainer (drives lifecycle_stage)
    revenue_cap: 1000                 # per-person cap on the capped revenue_<N>d outcomes (outliers swamp means)
    # Custom rollups: extra rollup_* columns on the month-end table (macro pocore_client_config__rollups)
    rollups: []

    # ── MODULES: one block per module, `module__<name>`; write only what you change ──────────────────
    # Every setting and its default: macros/client_config/pocore_client_config__module.sql
    # Optional modules take `enabled: false` to switch off (the rest of the block can stay).
    module__group: {}       # REQUIRED (no switch): segments, standard_splits, segment_sets, test-planning settings
    module__movement: {}    # optional: yearly donor status (pocore__year, __cohort__year, __person__year)
    module__cohort: {}      # optional: monthly givers by months since they started (survival_months, ltv_horizons_months)
    module__insights: {}    # optional: the Supporter Insights report (client_name, window_days, dimensions ...)

    # ── ADMIN: sign-off checks ───────────────────────────────────────────────────────────────────
    # Optional client model/seed with one row per fiscal year (giving_year, finance_revenue).
    # Null = not supplied; the finance_match checks say so.
    finance_totals_model: null
    finance_tolerance_pct: 1                # engine vs finance gap allowed before 'warn'
